<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0f1f">
    <title>Forgot Password | AG Ikenebgu & SDTG Management Platform</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="icon" href="../images/ag-logo.jpeg" type="image/jpeg">
</head>
<body class="auth-page">

    <div class="auth-bg" aria-hidden="true">
        <div class="auth-bg__grid"></div>
        <div class="auth-bg__orb auth-bg__orb--1"></div>
        <div class="auth-bg__orb auth-bg__orb--2"></div>
        <canvas id="authParticles" aria-hidden="true"></canvas>
    </div>

    <main class="auth-shell auth-shell--centered" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">

        <section class="auth-panel auth-panel--form" style="max-width:460px;width:100%">

            <div class="auth-form-card auth-glass" style="padding:36px">

                <div style="text-align:center;margin-bottom:28px">
                    <div style="display:flex;justify-content:center;gap:14px;margin-bottom:16px">
                        <div class="auth-logo-video auth-logo-video--ag" aria-hidden="true" style="width:56px;height:56px">
                            <video class="auth-logo-video__el" src="../videos/3D_video.mp4" autoplay muted loop playsinline></video>
                        </div>
                        <div class="auth-logo-video auth-logo-video--sdtg" aria-hidden="true" style="width:56px;height:56px">
                            <video class="auth-logo-video__el" src="../sdgt/videos/3d-logo.mp4" autoplay muted loop playsinline></video>
                        </div>
                    </div>
                    <h1 style="font-family:var(--auth-display);font-size:1.5rem;font-weight:700;margin-bottom:6px">Reset Password</h1>
                    <p style="font-size:0.88rem;color:var(--auth-text-muted)">Enter your admin email and we'll send a secure reset link.</p>
                </div>

                <form id="forgotForm" novalidate>
                    <div class="auth-field">
                        <input type="email" id="forgotEmail" class="auth-field__input" placeholder=" " required autocomplete="email" aria-describedby="forgotEmailError">
                        <label class="auth-field__label" for="forgotEmail">Admin Email Address</label>
                        <p id="forgotEmailError" class="auth-field__error" role="alert">Please enter a valid email address.</p>
                    </div>

                    <button type="submit" class="auth-submit" id="forgotSubmit">
                        <span class="auth-submit__content">
                            <i class="fas fa-paper-plane auth-submit__text" aria-hidden="true"></i>
                            <span class="auth-submit__text">Send Reset Link</span>
                        </span>
                    </button>

                    <p class="auth-form__footer" style="margin-top:20px">
                        <a href="admin-login.html" class="auth-link"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to Login</a>
                    </p>
                </form>

            </div>

        </section>

    </main>

    <script src="../js/auth.js" defer></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        var form = document.getElementById('forgotForm');
        if (!form) return;
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            var email = document.getElementById('forgotEmail');
            var err = document.getElementById('forgotEmailError');
            if (!email.value || !email.validity.valid) {
                email.classList.add('is-invalid');
                err.classList.add('is-visible');
                return;
            }
            email.classList.remove('is-invalid');
            err.classList.remove('is-visible');
            alert('Password reset link sent to ' + email.value + ' — connect PHP mailer for production.');
        });
    });
    </script>
</body>
</html>
