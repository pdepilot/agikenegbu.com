<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0f1f">
    <title>Signed Out | AG Ikenebgu & SDTG Management Platform</title>
    <meta name="description" content="You have been securely signed out of the AG Ikenebgu and SDTG administration platform.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="icon" href="../images/ag-logo.jpeg" type="image/jpeg">
    <style>
        .auth-logout__icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            color: var(--auth-success);
            background: rgba(34, 197, 94, 0.12);
            border: 2px solid rgba(34, 197, 94, 0.35);
            box-shadow: 0 0 32px rgba(34, 197, 94, 0.2);
            animation: authLogoutPop 0.8s var(--auth-spring) both;
        }

        @keyframes authLogoutPop {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        .auth-logout__progress {
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
            margin: 24px 0 12px;
        }

        .auth-logout__progress-bar {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--auth-gold), var(--auth-gold-light));
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        .auth-logout__redirect {
            font-size: 0.8rem;
            color: var(--auth-text-muted);
            text-align: center;
        }

        .auth-logout__actions {
            display: grid;
            gap: 12px;
            margin-top: 24px;
        }
    </style>
</head>
<body class="auth-page">

    <div class="auth-bg" aria-hidden="true">
        <div class="auth-bg__grid"></div>
        <div class="auth-bg__orb auth-bg__orb--1"></div>
        <div class="auth-bg__orb auth-bg__orb--2"></div>
        <canvas id="authParticles" aria-hidden="true"></canvas>
    </div>

    <main class="auth-shell auth-shell--centered" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">

        <section class="auth-panel auth-panel--form" style="max-width:460px;width:100%" aria-labelledby="logoutTitle">

            <div class="auth-form-card auth-glass" style="padding:36px">

                <div style="text-align:center;margin-bottom:8px">
                    <div style="display:flex;justify-content:center;gap:14px;margin-bottom:20px">
                        <div class="auth-logo-video auth-logo-video--ag" aria-hidden="true" style="width:52px;height:52px">
                            <video class="auth-logo-video__el" src="../videos/3D_video.mp4" autoplay muted loop playsinline></video>
                        </div>
                        <div class="auth-logo-video auth-logo-video--sdtg" aria-hidden="true" style="width:52px;height:52px">
                            <video class="auth-logo-video__el" src="../sdgt/videos/3d-logo.mp4" autoplay muted loop playsinline></video>
                        </div>
                    </div>

                    <div class="auth-logout__icon" aria-hidden="true">
                        <i class="fas fa-shield-halved"></i>
                    </div>

                    <h1 id="logoutTitle" style="font-family:var(--auth-display);font-size:1.5rem;font-weight:700;margin-bottom:8px">Signed Out Securely</h1>
                    <p style="font-size:0.88rem;color:var(--auth-text-muted);line-height:1.6">
                        Your admin session has ended. All local session data has been cleared.
                    </p>
                </div>

                <div class="auth-logout__progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Redirect progress">
                    <div class="auth-logout__progress-bar" id="logoutProgressBar"></div>
                </div>
                <p class="auth-logout__redirect" id="logoutRedirectText">Redirecting to login in <strong id="logoutCountdown">5</strong> seconds…</p>

                <div class="auth-logout__actions">
                    <a href="admin-login.html" class="auth-submit" style="text-decoration:none">
                        <span class="auth-submit__content">
                            <i class="fas fa-right-to-bracket auth-submit__text" aria-hidden="true"></i>
                            <span class="auth-submit__text">Sign In Again</span>
                        </span>
                    </a>
                    <a href="../index.html" class="auth-link" style="text-align:center;display:block;padding:10px">
                        <i class="fas fa-house" aria-hidden="true"></i> Return to Website
                    </a>
                </div>

                <p class="auth-form__footer" style="margin-top:20px;text-align:center">
                    AG Ikenebgu &amp; SDTG · Enterprise Admin Platform
                </p>

            </div>

        </section>

    </main>

    <script src="../js/auth.js" defer></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        /* Clear frontend session placeholders — replace with PHP session destroy on backend */
        try {
            sessionStorage.removeItem('cms_auth');
            sessionStorage.removeItem('cms_user');
            localStorage.removeItem('cms_remember');
        } catch (e) {}

        var bar = document.getElementById('logoutProgressBar');
        var countdownEl = document.getElementById('logoutCountdown');
        var progressWrap = document.querySelector('.auth-logout__progress');
        var seconds = 5;
        var elapsed = 0;
        var total = seconds * 1000;
        var interval = 50;

        var timer = setInterval(function () {
            elapsed += interval;
            var pct = Math.min((elapsed / total) * 100, 100);
            if (bar) bar.style.width = pct + '%';
            if (progressWrap) progressWrap.setAttribute('aria-valuenow', Math.round(pct));

            var remaining = Math.ceil((total - elapsed) / 1000);
            if (countdownEl) countdownEl.textContent = Math.max(remaining, 0);

            if (elapsed >= total) {
                clearInterval(timer);
                window.location.href = 'admin-login.html';
            }
        }, interval);
    });
    </script>
</body>
</html>
